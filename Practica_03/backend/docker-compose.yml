services:
  postgres:
    image: postgres:16
    container_name: multicatalogo-db
    # Las credenciales se leen del archivo .env (ver .env.example).
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Persistencia de los datos entre reinicios del contenedor.
      - multicatalogo-data:/var/lib/postgresql/data
      # Script que crea las tablas y carga los datos semilla la primera vez.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Caché en memoria para las consultas de lectura recurrentes (catálogo y red multinivel).
  # El backend en Go corre en la máquina (go run .) y se conecta a PostgreSQL y a Redis
  # usando las variables DB_* y REDIS_ADDR del archivo .env.
  redis:
    image: redis:alpine
    container_name: multicatalogo-redis
    ports:
      # Puerto de Redis en la máquina local.
      - "${REDIS_PORT}:6379"
    healthcheck:
      # Comprueba que Redis responde antes de dar el servicio por listo.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API en Go. Se construye con el Dockerfile del backend y espera a que
  # PostgreSQL y Redis estén listos antes de arrancar.
  backend:
    build: .
    container_name: multicatalogo-backend
    environment:
      # Dentro de la red de Docker cada servicio se llama por su nombre, no por localhost.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_ADDR: redis:6379
    ports:
      # API en http://localhost:3001 (el 3000 lo ocupa otro proyecto).
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  multicatalogo-data:
