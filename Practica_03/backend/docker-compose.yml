services:
  postgres:
    image: postgres:16
    container_name: multicatalogo-db
    # Las credenciales se leen del archivo .env (ver .env.example).
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Persistencia de los datos entre reinicios del contenedor.
      - multicatalogo-data:/var/lib/postgresql/data
      # Script que crea las tablas y carga los datos semilla la primera vez.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  multicatalogo-data:
